onboarding = false

[ui.toast]
delivery = "herdr"

[theme]
name = "solarized"
auto_switch = false

[keys]
prefix = "ctrl+a"

# terminal-browser plugin — install with:
#   herdr plugin install zenbu-labs/terminal-browser/herdr-plugin
[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "zenbu-labs.terminal-browser.open-split"
description = "open terminal-browser in a right split"

# terminal-browser needs the kitty graphics protocol. `terminal-browser setup`
# writes the [experimental] key; herdr 0.9.0 reads it from [terminal], so both
# are set. Requires a graphics-capable outer terminal (Ghostty, kitty, WezTerm).
[terminal]
kitty_graphics = true

[experimental]
kitty_graphics = true

[ui]
status_indicators = "symbols"
